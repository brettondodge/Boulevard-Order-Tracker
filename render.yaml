services:
  - type: web
    name: boulevard-order-tracker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --include=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PREVIEW_MODE
        value: "false"
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
