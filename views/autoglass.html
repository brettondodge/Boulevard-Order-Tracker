<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autoglass Scanning · Boulevard Glass Tools</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/autoglass.css">
  <script type="module" src="/autoglass.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/">BOULEVARD <span>GLASS TOOLS</span></a>
    <nav>
      <a href="/">Tools Home</a>
      <span id="user"></span>
    </nav>
  </header>
  <main>
    <p class="eyebrow">AUTO GLASS PARTS</p>
    <h1>Autoglass Scanning</h1>
    <nav class="ag-tabs" aria-label="Lists">
      <a href="#plk" data-tab="receiving">Receiving</a>
      <a href="#stock" data-tab="stock">Stock</a>
      <a href="#old" data-tab="old">Old inventory</a>
    </nav>
    <nav id="supplierTabs" class="ag-tabs ag-suppliers" aria-label="Receiving lists">
      <a href="#plk" data-tab="plk" class="plk">PLK <span data-count="plk"></span></a>
      <a href="#pgw" data-tab="pgw" class="pgw">PGW <span data-count="pgw"></span></a>
    </nav>
    <p id="tabIntro" class="muted"></p>
    <div id="printTitle" class="print-only print-title"></div>
    <div id="printSections" class="print-only"></div>

    <div class="scan-toolbar">
      <input id="searchInput" class="scan-search" type="search" aria-label="Search this list" placeholder="Search this list" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
      <div class="scan-actions">
        <button id="printList" type="button">Print</button>
        <a id="downloadInventory" class="button" href="#" hidden>Download spreadsheet</a>
        <button id="clearScans" type="button">Clear list</button>
      </div>
    </div>

    <div id="scanSheet" class="scan-sheet">
      <p id="scanSummary" class="scan-summary" aria-live="polite"></p>
      <ol id="scanRows" class="scan-list" aria-label="Scanned parts"></ol>
      <p id="noResults" class="scan-empty" hidden></p>
      <div class="scan-row scan-next">
        <span id="nextNumber" class="scan-number"></span>
        <input id="scanInput" type="text" aria-label="Next part number" placeholder="Scan the next part" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" autofocus>
      </div>
    </div>
    <p id="scanNote" class="muted scan-note" role="status"></p>
    <p id="scanMessage" class="error" role="alert"></p>

    <section id="schedulePanel" class="panel" aria-labelledby="scheduleTitle">
      <h2 id="scheduleTitle">Omega schedule</h2>
      <p class="muted">Each scan is checked against Omega work orders scheduled between these dates.</p>
      <div class="bar">
        <label>From<input id="scheduleFrom" type="date"></label>
        <label>To<input id="scheduleTo" type="date"></label>
        <button id="checkSchedule" type="button" class="primary">Check Omega</button>
      </div>
      <p id="scheduleStatus" aria-live="polite"></p>
      <ul id="unscanned" class="unscanned"></ul>
    </section>

    <section id="checkPanel" class="panel" aria-labelledby="checkTitle" hidden>
      <h2 id="checkTitle">Omega check</h2>
      <p id="checkAbout" class="muted"></p>
      <div class="bar"><button id="checkInventory" type="button" class="primary">Check now</button></div>
      <p id="checkStatus" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
